<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Clika</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F5F3">
<link rel="icon" type="image/png" sizes="512x512" href="/logos/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Mesma identidade da página inicial */
  :root { color-scheme: light; --bg: #F5F5F3; --ink: #0D0D0D; --white: #FFFFFF; --muted: #6B6B6B; --shadow: #BDBDBD; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 400 1.0625rem/1.6 "Figtree", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { width: min(560px, 100% - 32px); text-align: center; padding-block: 48px; }
  img { display: block; height: 32px; width: auto; margin: 0 auto 40px; }
  h1 { font: 800 clamp(2rem, 7vw, 3rem)/1.08 "Montserrat", sans-serif; letter-spacing: -0.03em; margin: 0; }
  p { color: var(--muted); margin: 16px 0 32px; }
  .btn { display: inline-flex; font: 600 1rem/1 "Figtree", sans-serif; text-decoration: none; padding: 15px 22px; border-radius: 999px; border: 2px solid var(--ink); background: var(--ink); color: var(--white); box-shadow: 3px 3px 0 var(--shadow); }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <a href="/"><img src="/logos/clika-logo-horizontal.svg" alt="Clika" width="120" height="32"></a>
  <h1>Página não encontrada</h1>
  <p>O endereço que você abriu não existe ou mudou de lugar.</p>
  <a class="btn" href="/">Voltar para a página inicial</a>
</main>
</body>
</html>
